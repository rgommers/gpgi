name: CI
on:
  push:
    branches:
    - main
    - ci-win
  pull_request:
  schedule:
    # run this every Wednesday at 3 am UTC
  - cron: 0 3 * * 3
  workflow_dispatch:

concurrency:
  # auto-cancel any in-progress job *on the same branch*
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ${{matrix.os}} x py${{matrix.python-version}} ${{matrix.marker}}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          python-version: '3.13'

        # test GPGI_PY_LIB
        - marker: PY_LIB
          os: ubuntu-latest
          python-version: '3.13'

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
      with:
        python-version: ${{ matrix.python-version }}

    # TODO: add --no-editable
    - run: uv sync --no-editable --group covcheck
    - name: Test
      env:
        GPGI_PY_LIB: ${{ matrix.marker == 'PY_LIB' }}
      shell: bash # for windows-compat (using `\` as a line continuation)
      run: |
        uv run --no-sync \
          coverage run --parallel-mode -m pytest --color=yes -ra

    - name: Upload coverage data
      # only using reports from ubuntu because
      # combining reports from multiple platforms is tricky (or impossible ?)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: gpgi_coverage_data-${{matrix.os}}-${{matrix.python-version}}-${{matrix.marker}}
        path: .coverage.*
        if-no-files-found: ignore
        include-hidden-files: true


